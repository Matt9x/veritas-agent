[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-verification-snapshot"
version = "0.1.0"
description = "Verification-first research subset with explicit state and evidence-backed completion."
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.4"]
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
